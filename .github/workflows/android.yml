name: Build Prosperity Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix and Init Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force || true

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Android NDK
        uses: nvim-treesitter/setup-ndk-action@v1
        with:
          ndk-version: r26b

      - name: Build Android APK using Nix Shell
        run: |
          # Явно подгружаем окружение Nix в текущий bash-сеанс
          if [ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          fi

          nix develop --command bash -c "
            cmake -G Ninja -B build_android \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DDELTA_ANDROID_APP=ON && \
            cmake --build build_android
          "

      - name: Upload Artifact (APK & Libraries)
        uses: actions/upload-artifact@v4
        with:
          name: prosperity-android-build
          path: |
            build_android/**/*.apk
            build_android/**/*.so
