name: Build Prosperity Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Используем официальный проверенный инсталлятор Nix
      - name: Install Nix
        uses: Cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Настраиваем Android NDK штатными средствами Runner'а
      - name: Setup Android NDK
        uses: nvim-treesitter/setup-ndk-action@v1
        with:
          ndk-version: r26b

      - name: Build Android APK using Nix Shell
        run: |
          nix develop --command bash -c "
            cmake -G Ninja -B build_android \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DDELTA_ANDROID_APP=ON && \
            cmake --build build_android
          "

      - name: Upload Artifact (APK & Libraries)
        uses: actions/upload-artifact@v4
        with:
          name: prosperity-android-build
          path: |
            build_android/**/*.apk
            build_android/**/*.so
