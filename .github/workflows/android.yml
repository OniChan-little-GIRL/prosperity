name: Build Prosperity Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Build APK
        shell: bash
        run: ./scripts/build_android_apk_ci.sh

      - name: Upload Artifact (APK & Libraries)
        uses: actions/upload-artifact@v4
        with:
          name: prosperity-android-build
          if-no-files-found: error
          path: |
            build_android/apk/*.apk
            build_android/**/*.so
