name: Build Prosperity Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: determinate-systems/nix-installer-action@v12

      - name: Setup Android NDK
        uses: nsetup/setup-sdk@v1
        with:
          ndk-version: '26.1.10909125'

      - name: Build Android APK using Nix Shell
        run: |
          nix develop --command bash -c "
            cmake -G Ninja -B build_android \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DDELTA_ANDROID_APP=ON && \
            cmake --build build_android
          "

      - name: Upload Artifact (APK & Libraries)
        uses: actions/upload-artifact@v4
        with:
          name: prosperity-android-build
          path: |
            build_android/**/*.apk
            build_android/**/*.so

