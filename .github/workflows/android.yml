name: Build Prosperity Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Init available submodules
        shell: bash
        run: |
          set -euxo pipefail

          git submodule sync --recursive

          # vendor/equilibrium currently points at a commit that is not present
          # on the configured remote anymore. Updating all submodules at once
          # makes GitHub Actions fail with "upload-pack: not our ref", so update
          # the healthy submodules explicitly and handle equilibrium below.
          git config --file .gitmodules --get-regexp 'submodule\..*\.path' |
          while read -r key path; do
            if [ "$path" = "vendor/equilibrium" ]; then
              continue
            fi

            git submodule update --init --recursive --force --jobs 4 "$path"
          done

      - name: Restore equilibrium fallback
        shell: bash
        run: |
          set -euxo pipefail

          expected_commit="$(git ls-tree HEAD vendor/equilibrium | awk '{print $3}')"
          rm -rf vendor/equilibrium

          git clone https://github.com/Force67/equilibrium.git vendor/equilibrium
          if ! git -C vendor/equilibrium checkout --detach "$expected_commit"; then
            echo "::warning::equilibrium commit $expected_commit is unavailable on the remote; using the remote default branch instead."
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Android NDK
        uses: nvim-treesitter/setup-ndk-action@v1
        with:
          ndk-version: r26b

      - name: Build Android APK using Nix Shell
        shell: bash
        run: |
          set -euxo pipefail

          # Явно подгружаем окружение Nix в текущий bash-сеанс.
          if [ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
            . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
          fi

          ndk_home="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}}"
          if [ -z "$ndk_home" ]; then
            echo "Android NDK path was not exported by setup-ndk-action" >&2
            exit 1
          fi

          nix develop --command bash -c '
            set -euxo pipefail
            cmake -G Ninja -B build_android \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="'"$ndk_home"'/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DDELTA_ANDROID_APP=ON
            cmake --build build_android
          '

      - name: Upload Artifact (APK & Libraries)
        uses: actions/upload-artifact@v4
        with:
          name: prosperity-android-build
          if-no-files-found: error
          path: |
            build_android/**/*.apk
            build_android/**/*.so
